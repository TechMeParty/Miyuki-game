<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ROOM 03</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#000;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}#app{height:100dvh;max-width:720px;margin:auto;position:relative;background:#050505;overflow:hidden}#hud{position:absolute;z-index:30;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;display:flex;justify-content:space-between;background:linear-gradient(#000d,transparent);font-size:12px;letter-spacing:.14em}.bar{display:inline-block;width:76px;height:6px;background:#242424;border-radius:8px;overflow:hidden;margin-left:5px}.bar i{display:block;height:100%;width:10%;background:#a31b1b;transition:.3s}.scene{position:absolute;left:0;right:0;top:0;height:70%;background:url('assets/room03-bg.jpg') center center/cover no-repeat;box-shadow:inset 0 -40px 60px #000}.hot{position:absolute;z-index:10;border:0;background:transparent}.hot:active{background:#ffffff12}.hot span{display:none}.bed{left:0;top:38%;width:52%;height:42%}.window{left:32%;top:10%;width:24%;height:43%}.mirror{left:57%;top:12%;width:20%;height:34%}.phone{left:55%;top:44%;width:20%;height:23%}.door{right:0;top:20%;width:25%;height:58%}.pulse{animation:pulse .8s infinite alternate}@keyframes pulse{from{box-shadow:inset 0 0 0 2px #a3151555}to{box-shadow:inset 0 0 22px #c41d1d55}}#figure{display:none;position:absolute;z-index:6;left:42%;top:14%;width:12%;height:45%;background:#000c;filter:blur(2px);clip-path:polygon(35% 0,65% 0,74% 15%,70% 45%,94% 100%,6% 100%,30% 45%,26% 15%)}#face{display:none;position:absolute;z-index:7;left:64%;top:22%;width:7%;height:11%;border-radius:50%;background:#000;box-shadow:0 0 16px #000}.panel{position:absolute;left:0;right:0;bottom:0;height:33%;z-index:25;background:linear-gradient(#090909,#020202);border-top:1px solid #333;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}.speaker{font-size:10px;color:#9b9b9b;letter-spacing:.18em;margin-bottom:6px}.text{font-size:16px;line-height:1.55;min-height:54px}.hint{font-size:11px;color:#777;margin-top:8px}.status{display:flex;gap:8px;margin-top:10px;font-size:11px;color:#999}.chip{border:1px solid #333;padding:6px 8px;border-radius:5px}.choices{display:none;position:absolute;left:12px;right:12px;bottom:calc(34% + 8px);z-index:40;gap:7px}.choice{padding:13px;border:1px solid #555;border-radius:6px;background:#111e;color:#eee;font-weight:700}.danger{background:#351010;border-color:#7b2626}#start,#ending{position:absolute;inset:0;z-index:100;background:radial-gradient(circle,#171919,#000 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}#start h1{font-size:40px;letter-spacing:.24em;margin:0 0 8px}#start p,#ending p{color:#aaa;line-height:1.7}.btn{padding:13px 28px;background:#111;border:1px solid #777;color:#fff;border-radius:5px;font-weight:800}#ending{display:none;z-index:120}#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:90;pointer-events:none}.shake{animation:shake .18s linear 2}@keyframes shake{25%{transform:translate(-5px,2px)}50%{transform:translate(5px,-2px)}75%{transform:translate(-3px)}}@media(max-height:700px){.scene{height:67%}.panel{height:36%}}</style></head><body><div id="app"><div id="hud"><b>ROOM 03</b><span>FEAR <span class="bar"><i id="fearFill"></i></span></span></div><div class="scene"><button class="hot bed" id="bed"><span>bed</span></button><button class="hot window" id="window"><span>window</span></button><button class="hot mirror" id="mirror"><span>mirror</span></button><button class="hot phone" id="phone"><span>phone</span></button><button class="hot door" id="door"><span>door</span></button><div id="figure"></div><div id="face"></div></div><div class="choices" id="choices"></div><div class="panel"><div class="speaker" id="speaker">YOU</div><div class="text" id="text">……ここは、どこだ。</div><div class="hint" id="hint">気になる場所をタップして調べる</div><div class="status"><span class="chip" id="clueChip">CLUES 0/6</span><span class="chip">ENDING ???</span><span class="chip">03:03</span></div></div><div id="flash"></div><div id="start"><h1>ROOM 03</h1><p>午前3時03分。<br>知らない部屋で目を覚ました。<br><br>ドアの向こうから、誰かが呼んでいる。</p><button class="btn" id="startBtn">目を開ける</button><small style="color:#666;margin-top:16px">短編探索ホラー / 3 endings</small></div><div id="ending"><h2 id="endTitle"></h2><p id="endText"></p><button class="btn" onclick="location.reload()">もう一度</button></div></div><script>const $=x=>document.getElementById(x);let fear=10,mirror=0,door=0,phone=0,win=0,bed=0,clues=0,started=false,ended=false,foundPhone=false;function say(t,s='YOU',h='気になる場所をタップして調べる'){$('speaker').textContent=s;$('text').textContent=t;$('hint').textContent=h}function clue(){clues=Math.min(6,clues+1);$('clueChip').textContent='CLUES '+clues+'/6'}function setFear(n){fear=Math.min(100,fear+n);$('fearFill').style.width=fear+'%';if(n>15){$('app').classList.add('shake');setTimeout(()=>$('app').classList.remove('shake'),400)}}function flash(){let f=$('flash');f.style.opacity=.78;setTimeout(()=>f.style.opacity=0,60)}function beep(f=150,d=.12){try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}function showChoices(a){let c=$('choices');c.innerHTML='';c.style.display='grid';a.forEach(x=>{let b=document.createElement('button');b.className='choice'+(x.d?' danger':'');b.textContent=x.t;b.onclick=()=>{c.style.display='none';x.f()};c.appendChild(b)})}function end(t,b){ended=true;$('ending').style.display='flex';$('endTitle').textContent=t;$('endText').innerHTML=b}$('startBtn').onclick=()=>{started=true;$('start').style.display='none';say('……出口を探さないと。')};$('mirror').onclick=()=>{if(!started||ended)return;mirror++;beep(230);if(mirror===1){clue();say('鏡だ。……後ろに何か映った気がする。');setFear(10)}else{$('face').style.display='block';flash();say('僕の後ろに、誰かいる。');setFear(22)}};$('window').onclick=()=>{if(!started||ended)return;win++;if(win===1){clue();say('外は真っ暗だ。月が妙に近い。')}else{$('figure').style.display='block';flash();beep(70,.3);say('窓の向こうに人がいる。……ここは何階なんだ？');setFear(25)}};$('bed').onclick=()=>{if(!started||ended)return;bed++;if(bed===1){clue();say('シーツが暖かい。誰かが今まで寝ていた。')}else if(!foundPhone){foundPhone=true;clue();flash();say('ベッドの下にスマホがある。画面には「03:03」。','YOU','電話台のスマホをタップして確認する');$('phone').classList.add('pulse');setFear(14)}else if(phone>=3){showChoices([{t:'ベッドの下に隠れる',f:hide},{t:'まだ調べる',f:()=>say('もう少し部屋を調べよう。')}])}else say('ベッドの下にはもう何もない。')};$('phone').onclick=()=>{if(!started||ended)return;phone++;$('phone').classList.remove('pulse');beep(440,.18);if(phone===1){clue();say('画面に着信。「自分」からだ。','PHONE','もう一度電話をタップして出る');$('phone').classList.add('pulse');setFear(8)}else if(phone===2){say('「ドアを開けるな。鏡を二度見ろ。」','PHONE','鏡をもう一度調べる');setFear(12)}else if(phone===3){clue();say('メモが1件ある。「03:03になったら動くな。ベッドの下へ」','PHONE','ベッドをタップして隠れることができる');setFear(10)}else say('電池が切れた。','PHONE')};$('door').onclick=()=>{if(!started||ended)return;door++;beep(100);if(door===1){clue();say('鍵がかかっている。向こう側で息遣いがする。');setFear(8)}else if(door===2){say('……コン、コン。','DOOR');setFear(15)}else{flash();say('「開けて」——僕の声だ。','DOOR');setFear(20);showChoices([{t:'ドアを開ける',d:true,f:openDoor},{t:'ドアから離れる',f:()=>say('足音が遠ざかる。まだ調べられる。')},{t:'ベッドの下に隠れる',f:hide}])}};function hide(){if(phone>=3&&clues>=4){beep(55,.5);setTimeout(()=>end('ENDING 03 — 03:04','息を殺して待った。<br>時計が03:04に変わる。<br><br>ドアの向こうの「僕」は消え、<br>初めて朝が来た。'),600)}else say('まだ隠れるべき時じゃない。手がかりが足りない。')}function openDoor(){beep(45,.6);setTimeout(()=>{if(clues>=5)end('ENDING 02 — THE OTHER SIDE','ドアの向こうにいたのは、<br>部屋を外から見ている「あなた」だった。<br><br>部屋の中には、もう誰もいない。');else end('ENDING 01 — DO NOT OPEN','ドアを開けた瞬間、<br>時計は03:03に戻った。<br><br>また最初からだ。')},500)}</script></body></html>
