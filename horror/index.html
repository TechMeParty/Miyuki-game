<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ROOM 03</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#020303;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}#app{height:100dvh;max-width:540px;margin:auto;position:relative;overflow:hidden;background:#050707}#hud{position:absolute;z-index:20;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 16px 8px;display:flex;justify-content:space-between;background:linear-gradient(#000c,transparent);font-size:12px;letter-spacing:.16em}.bar{width:78px;height:6px;background:#292929;display:inline-block;border-radius:8px;overflow:hidden;margin-left:6px}.bar i{display:block;height:100%;width:10%;background:#9d1717;transition:.3s}#scene{position:absolute;inset:0;background:radial-gradient(circle at 48% 45%,#273033 0,#101516 35%,#050707 72%)}.wall{position:absolute;inset:10% 0 22%;background:linear-gradient(90deg,#101516,#252b2a 47%,#111616);border-bottom:7px solid #080a09}.wall:after{content:"";position:absolute;inset:0;opacity:.35;background:repeating-linear-gradient(87deg,transparent 0 47px,#090b0b 48px 49px)}.floor{position:absolute;bottom:-4%;left:-12%;width:124%;height:32%;background:repeating-linear-gradient(95deg,#181713 0 50px,#0c0c0a 51px 54px);transform:perspective(280px) rotateX(22deg);transform-origin:bottom}.lamp{position:absolute;left:48%;top:13%;width:3px;height:22%;background:#252522;box-shadow:0 0 3px #000}.lamp:after{content:"";position:absolute;left:-22px;bottom:-10px;width:46px;height:20px;background:#8b7a4b;clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);filter:brightness(.5);box-shadow:0 0 45px #9b7c35}.obj{position:absolute;z-index:4;filter:brightness(.72);transition:.15s;cursor:pointer}.obj:active{filter:brightness(1.15);transform:scale(.985)}#door{right:5%;top:23%;width:25%;height:51%;background:linear-gradient(90deg,#17110d,#30251b 48%,#15100c);border:7px solid #0c0b09;box-shadow:0 10px 25px #000,inset 0 0 0 2px #403326}.knob{position:absolute;left:14%;top:52%;width:10px;height:10px;background:#9a7d42;border-radius:50%;box-shadow:0 0 8px #000}#window{left:34%;top:19%;width:27%;height:25%;border:7px solid #101313;background:linear-gradient(#071019,#010303);box-shadow:0 0 25px #000}#window:before,#window:after{content:"";position:absolute;background:#111515}#window:before{width:5px;left:49%;top:0;bottom:0}#window:after{height:5px;top:49%;left:0;right:0}#moon{position:absolute;width:18px;height:18px;border-radius:50%;background:#b8c6c8;right:12%;top:13%;box-shadow:0 0 18px #a7c3c8;opacity:.55}#mirror{left:6%;top:22%;width:22%;height:31%;border:7px solid #171817;background:linear-gradient(140deg,#364044,#090b0c);box-shadow:0 8px 25px #000}.face{display:none;position:absolute;left:37%;top:20%;width:25%;height:45%;border-radius:48%;background:#010101;box-shadow:0 0 12px #000}.face:before,.face:after{content:"";position:absolute;top:38%;width:4px;height:3px;background:#d8d8d8}.face:before{left:25%}.face:after{right:25%}#bed{left:-4%;bottom:14%;width:61%;height:20%;background:linear-gradient(#292827,#121212);border:3px solid #090909;transform:skewX(-7deg);box-shadow:0 15px 25px #000}#bed:before{content:"";position:absolute;left:9%;top:5%;width:34%;height:35%;background:#41403c;border-radius:8px}#table{position:absolute;left:49%;top:50%;width:15%;height:17%;border-top:6px solid #2b241b;border-left:4px solid #1c1813;border-right:4px solid #1c1813}#phone{left:51%;top:47.5%;width:10%;height:5%;background:#080808;border:2px solid #444;border-radius:4px;box-shadow:0 0 8px #000}#phone.ring{animation:ring .12s linear 5;box-shadow:0 0 18px #971919}@keyframes ring{50%{transform:translateX(3px)}}#figure{display:none;position:absolute;z-index:3;left:43%;bottom:23%;width:13%;height:45%;background:#010101;clip-path:polygon(37% 0,63% 0,75% 13%,69% 43%,93% 100%,7% 100%,31% 43%,25% 13%);filter:blur(.4px)}#vignette{position:absolute;inset:0;pointer-events:none;z-index:9;box-shadow:inset 0 0 120px 35px #000}#msg{position:absolute;z-index:30;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));padding:14px;background:linear-gradient(135deg,#090b0bf2,#111414f2);border:1px solid #343838;border-radius:8px;box-shadow:0 10px 35px #000;min-height:105px}#speaker{font-size:10px;color:#8d9999;letter-spacing:.2em;margin-bottom:7px}#text{font-size:16px;line-height:1.55}.hint{font-size:11px;color:#788080;margin-top:7px;text-align:right}#choices{display:none;position:absolute;z-index:40;left:12px;right:12px;bottom:calc(130px + env(safe-area-inset-bottom));gap:8px}.choice{padding:14px;background:#151919eF;border:1px solid #555;color:#eee;border-radius:7px;font-size:15px;font-weight:700}.danger{background:#321010;border-color:#7c2525}#start,#ending{position:absolute;inset:0;z-index:100;background:radial-gradient(circle,#141919,#000 70%);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px}#start h1{font-size:42px;letter-spacing:.25em;margin:0}#start p,#ending p{color:#9ca3a3;line-height:1.7}.btn{padding:14px 32px;background:#111;border:1px solid #777;color:white;border-radius:5px;font-weight:800}#ending{display:none;z-index:110}#ending h2{letter-spacing:.12em}#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:90}.shake{animation:shake .2s linear 2}@keyframes shake{25%{transform:translate(-5px,2px)}50%{transform:translate(5px,-2px)}75%{transform:translate(-3px)}}
</style></head><body><div id="app"><div id="hud"><b>ROOM 03</b><span>FEAR <span class="bar"><i id="fearFill"></i></span></span></div><div id="scene"><div class="wall"></div><div class="floor"></div><div class="lamp"></div><div id="window" class="obj"><i id="moon"></i></div><div id="mirror" class="obj"><i id="face" class="face"></i></div><div id="door" class="obj"><i class="knob"></i></div><div id="bed" class="obj"></div><div id="table"></div><div id="phone" class="obj"></div><div id="figure"></div><div id="vignette"></div></div><div id="choices"></div><div id="msg"><div id="speaker">YOU</div><div id="text">……ここは、どこだ。</div><div class="hint" id="hint">光っている場所や家具をタップして調べる</div></div><div id="flash"></div><div id="start"><h1>ROOM 03</h1><p>午前3時03分。<br>知らない部屋で目を覚ました。<br><br>ドアの向こうから、誰かが呼んでいる。</p><button class="btn" id="startBtn">目を開ける</button><small style="color:#555;margin-top:18px">短編2D探索ホラー / 3 endings</small></div><div id="ending"><h2 id="endTitle"></h2><p id="endText"></p><button class="btn" onclick="location.reload()">もう一度</button></div></div>
<script>
const $=x=>document.getElementById(x);let fear=10,mirror=0,door=0,phone=0,win=0,bed=0,clues=0,started=false,ended=false,foundPhone=false;
function say(t,s='YOU',h='部屋の中をタップして調べる'){$('speaker').textContent=s;$('text').textContent=t;$('hint').textContent=h}function setFear(n){fear=Math.min(100,fear+n);$('fearFill').style.width=fear+'%';if(n>15){$('app').classList.add('shake');setTimeout(()=>$('app').classList.remove('shake'),450)}}function flash(){let f=$('flash');f.style.opacity=.8;setTimeout(()=>f.style.opacity=0,60)}function beep(f=150,d=.12){try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}function choices(a){let c=$('choices');c.innerHTML='';c.style.display='grid';a.forEach(x=>{let b=document.createElement('button');b.className='choice'+(x.d?' danger':'');b.textContent=x.t;b.onclick=()=>{c.style.display='none';x.f()};c.appendChild(b)})}function end(t,b){ended=true;$('ending').style.display='flex';$('endTitle').textContent=t;$('endText').innerHTML=b}
$('startBtn').onclick=()=>{started=true;$('start').style.display='none';say('……出口を探さないと。')};
$('mirror').onclick=()=>{if(!started||ended)return;mirror++;beep(230);if(mirror==1){clues++;say('鏡だ。……後ろに何か映った気がする。');setFear(10)}else{$('face').style.display='block';flash();say('僕の後ろに、誰かいる。');setFear(22)}};
$('window').onclick=()=>{if(!started||ended)return;win++;if(win==1){clues++;say('外は真っ暗だ。月が妙に近い。')}else{$('figure').style.display='block';flash();beep(70,.3);say('窓の向こうに人がいる。……ここは何階なんだ？');setFear(25)}};
$('bed').onclick=()=>{if(!started||ended)return;bed++;if(bed==1){clues++;say('シーツが暖かい。誰かが今まで寝ていた。')}else if(!foundPhone){foundPhone=true;clues++;flash();say('ベッドの下にスマホがある。画面には「03:03」。','YOU','スマホをタップして確認する');$('phone').classList.add('ring');setFear(14)}else say('ベッドの下にはもう何もない。')};
$('phone').onclick=()=>{if(!started||ended)return;phone++;$('phone').classList.remove('ring');beep(440,.18);if(phone==1){clues++;say('画面に着信。「自分」からだ。','PHONE','もう一度スマホをタップして電話に出る');$('phone').classList.add('ring');setFear(8)}else if(phone==2){say('「ドアを開けるな。鏡を二度見ろ。窓も二度見るな。」','PHONE','鏡・窓・ドアを調べて手がかりを集める');setFear(12)}else if(phone==3){say('メモが1件ある。「ベッドの下に隠れろ。03:03になったら動くな」','PHONE','ベッドをタップすると隠れられる');setFear(10)}else say('電池が切れた。','PHONE')};
$('door').onclick=()=>{if(!started||ended)return;door++;beep(100);if(door==1){say('鍵がかかっている。向こう側で息遣いがする。');setFear(8)}else if(door==2){say('……コン、コン。','DOOR');setFear(15)}else{flash();say('「開けて」——僕の声だ。','DOOR');setFear(20);choices([{t:'ドアを開ける',d:true,f:openDoor},{t:'ドアから離れる',f:()=>say('足音が遠ざかる。まだ調べられる。')},{t:'ベッドの下に隠れる',f:hide}])}};
function hide(){if(phone>=3&&clues>=4){beep(55,.5);setTimeout(()=>end('ENDING 03 — 03:04','息を殺して待った。<br>時計が03:04に変わる。<br><br>ドアの向こうの「僕」は消え、<br>初めて朝が来た。'),600)}else{say('まだ隠れるべき時じゃない気がする。手がかりが足りない。')}}function openDoor(){beep(45,.6);setTimeout(()=>{if(clues>=5)end('ENDING 02 — THE OTHER SIDE','ドアの向こうにいたのは、<br>部屋を外から見ている「あなた」だった。<br><br>部屋の中には、もう誰もいない。');else end('ENDING 01 — DO NOT OPEN','ドアを開けた瞬間、<br>時計は03:03に戻った。<br><br>また最初からだ。')},500)}
</script></body></html>
